# Keyless Agent Teams composition over the real headless app and deterministic fixture adapter.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: tool-subagent-control
        name: '@deepseek-ai/dsh-tool-subagent-control'
        disabled: true
      - id: tool-subagent-list-agents
        name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
        disabled: true
      - id: tool-subagent-report
        name: '@deepseek-ai/dsh-tool-subagent-report'
        disabled: true
      - id: tool-subagent
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: one-shot
          maxDepth: 1
      - id: tool-subagent-fork
        name: '@deepseek-ai/dsh-tool-subagent'
        config:
          provider: fork
          toolName: subagent_fork
          backgroundMode: one-shot
          enableRunInBackground: false
          maxDepth: 1
      - insert:
          - id: agent-team
            name: '@deepseek-ai/dsh-experimental-agent-team'
            config:
              worktreeProvider: !!js "process.env.DSH_TEAM_WORKTREES === '1' ? 'git' : undefined"
              integrationProvider: !!js "process.env.DSH_TEAM_WORKTREES === '1' ? 'git' : undefined"
              maxMembers: 8
              maxTasks: 256
              maxPendingMessagesPerMember: 64
              maxMessageBytes: 65536
              disposalTimeoutMs: 5000
          - id: tool-agent-team
            name: '@deepseek-ai/dsh-experimental-tool-agent-team'
            config:
              freshProvider: spawn
              forkProvider: fork
          - id: team-fixture-llm
            name: './tests/fixtures/team-llm.mjs'
          - id: team-git-worktrees
            name: '@deepseek-ai/dsh-experimental-agent-team/git-worktrees'
            disabled: !!js "process.env.DSH_TEAM_WORKTREES !== '1'"
            config:
              directory: !!js "process.cwd() + '-workers'"
          - id: team-git-integration
            name: '@deepseek-ai/dsh-experimental-agent-team/git-integration'
            disabled: !!js "process.env.DSH_TEAM_WORKTREES !== '1'"
            config:
              targetBranch: main
              verification:
                - command: !!js process.execPath
                  args: ['-e', "if(require('node:fs').readFileSync('shared.txt','utf8')!=='worker\\n')process.exit(1)"]
