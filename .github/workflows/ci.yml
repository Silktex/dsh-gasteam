name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:docs
      - run: pnpm build
      - run: pnpm typecheck
      - name: Enable disposable-runner user namespaces for strict runtime conformance
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --mount-proc --kill-child -- true
      - run: pnpm test
      - run: pnpm test:acceptance
      - run: pnpm test:smoke
      - run: GASTEAM_RELEASE_ROOT=/var/tmp pnpm test:release
